services:
  mongo3:
    hostname: mongo3
    image: percona/percona-server-mongodb:3.6.19-7.0
    platform: linux/amd64
    entrypoint:
      [
        "/usr/bin/mongod",
        "--replSet",
        "rs",
        "--journal",
        "--smallfiles",
        "--bind_ip_all",
      ]
    ports:
      - "27018:27017"
      - "28018:28017"
    restart: always

  mongo2:
    hostname: mongo2
    image: percona/percona-server-mongodb:3.6.19-7.0
    platform: linux/amd64
    entrypoint:
      [
        "/usr/bin/mongod",
        "--replSet",
        "rs",
        "--journal",
        "--smallfiles",
        "--bind_ip_all",
      ]
    ports:
      - "27019:27017"
      - "28019:28017"
    restart: always

  mongo1:
    hostname: mongo1
    image: percona/percona-server-mongodb:3.6.19-7.0
    platform: linux/amd64
    entrypoint:
      [
        "/usr/bin/mongod",
        "--replSet",
        "rs",
        "--journal",
        "--smallfiles",
        "--bind_ip_all",
      ]
    ports:
      - "27017:27017"
      - "28017:28017"
    links:
      - mongo2:mongo2
      - mongo3:mongo3
    restart: always

  elasticsearch:
    hostname: elasticsearch
    image: elasticsearch:5.6.16
    platform: linux/amd64
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"
      - "9300:9300"
    links:
      - mongo1:mongo1
      - mongo2:mongo2
      - mongo3:mongo3
    volumes:
      - ./elasticsearch/logging.yml:/etc/elasticsearch/logging.yml
    restart: always

  # This configures the MongoDB replicaset
  mongosetup:
    image: percona/percona-server-mongodb:3.6.19-7.0
    platform: linux/amd64
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    links:
      - mongo1:mongo1
      - mongo2:mongo2
      - mongo3:mongo3
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/scripts/setup.sh"]

  ###################################################################
  # Make sure you include either mongo-connector OR transporter.
  ###################################################################

  transporter:
    image: golang:1.18.3
    platform: linux/amd64
    depends_on:
      - mongo1
      - mongo2
      - mongo3
      - elasticsearch
    links:
      - mongo1:mongo1
      - mongo2:mongo2
      - mongo3:mongo3
      - elasticsearch:elasticsearch
    volumes:
      - ./transporter:/transporter
      - ./scripts:/scripts
    entrypoint: ["/transporter/run.sh"]
    restart: "no"

  # Make sure ES does not rellocate it's shards when it has low disk space.
  disabledisktreshold:
    image: percona/percona-server-mongodb:3.6.19-7.0
    platform: linux/amd64
    depends_on:
      - elasticsearch
    links:
      - elasticsearch:elasticsearch
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/scripts/disable-disk-treshold.sh"]


    # Verify reading and writing
    # Run 'docker logs -f elastic-mongo_verify_1' to see what it outputs.
    # That works even though the container has stopped.

  verify:
    image: percona/percona-server-mongodb:3.6.19-7.0
    platform: linux/amd64
    depends_on:
      - mongo1
      - mongo2
      - mongo3
      - elasticsearch
    links:
      - mongo1:mongo1
      - mongo2:mongo2
      - mongo3:mongo3
      - elasticsearch:elasticsearch
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/scripts/query.sh"]
